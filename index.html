<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>
  // Tablets (iPad): lay the page out at 740px wide and let iOS scale it up to fill the screen, so the game
  // looks the same as on a phone, just bigger. (CSS zoom broke tap positions in WKWebView.)
  (function () {
    var short = Math.min(screen.width, screen.height);
    if (short >= 700 && matchMedia("(pointer: coarse)").matches) {
      document.querySelector('meta[name=viewport]').setAttribute("content", "width=740, viewport-fit=cover, user-scalable=no");
    }
  })();
</script>
<meta name="color-scheme" content="dark">
<title>Block Rush — Memorize. Rebuild. Survive.</title>
